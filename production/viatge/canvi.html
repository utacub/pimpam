<!doctype html><meta charset=utf-8><body style="margin:0;background:#000"><canvas id=c></canvas>
<script type=module>
import {vgNewFlight,vgTotal,vgTick,VG_LAND_AT} from '../../dist/viatge.js';import {vgRender,vgLoadShare} from '../../dist/viatge-art.js';
const cv=document.getElementById('c'),W=innerWidth,H=innerHeight;cv.width=W;cv.height=H;const c=cv.getContext('2d');
window.run=async()=>{const s={vgDay:'curta',background:'full',base:'black',opacity:25,waitCue:false,interaction:'hold'};const game={};const f=vgNewFlight(3,s);game.viatge=f;while(vgLoadShare(game)<1);
 f.phase='fly';f.a=.1;f.dist=vgTotal(s)*.9;const log=[];let shots=[],worst=0;
 for(let i=0;i<60*60;i++){const t0=performance.now();vgTick(game,s,1/30);vgRender(c,W,H,game,s,false);const dt=performance.now()-t0;const g=game.viatge;if(g.phase==='next'||g.phase==='takeoff')worst=Math.max(worst,dt);
  const key=g.phase+'|'+g.v;if(key!==log[log.length-1])log.push(key);if(i%150===0)shots.push([i,g.phase,g.v,+g.a.toFixed(2)]);if(g.v!==3&&g.phase==='fly')break;}
 return {log,worst:+worst.toFixed(1),shots:shots.slice(-6)};};
window.ready=true;
</script>
