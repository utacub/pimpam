<!doctype html><meta charset=utf-8><body style="margin:0;background:#000"><canvas id=c></canvas>
<script type=module>
import {vgNewFlight,vgTotal,VG_MARK_AT} from '../../dist/viatge.js';
import {vgRender,vgLoadShare} from '../../dist/viatge-art.js';
const cv=document.getElementById('c'),W=innerWidth,H=innerHeight,dpr=devicePixelRatio;cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+'px';cv.style.height=H+'px';
const c=cv.getContext('2d');
window.shot=async(o)=>{const s={vgDay:'normal',background:o.bg||'full',base:o.base||'black',opacity:25,waitCue:true,sound:false,interaction:'hold'};
 const game={};const f=vgNewFlight(o.v,s);f.phase=o.phase||'fly';f.a=o.a;f.dist=o.p*vgTotal(s);f.t=o.t||10;f.bob=f.t;f.burn=!!o.burn;f.pose=o.pose||{mila:'point',bru:'peek'};if(o.land)f.land={site:f.dist+200};game.viatge=f;
 const t0=performance.now();let n=0;while(vgLoadShare(game)<1)n++;const tl=performance.now()-t0;
 c.setTransform(dpr,0,0,dpr,0,0);for(let i=0;i<14;i++){f.t+=.05;vgRender(c,W,H,game,s,false);}
 const t1=performance.now();for(let i=0;i<30;i++){f.t+=1/60;f.dist+=1;vgRender(c,W,H,game,s,false);}const tr=(performance.now()-t1)/30;
 return {tl,tr};};
window.ready=true;
</script>
