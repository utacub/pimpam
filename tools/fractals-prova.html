<!doctype html><meta charset="utf-8"><title>Fractals · prova</title><style>html,body{margin:0;background:#000}canvas{display:block}</style>
<canvas id="c"></canvas>
<script type="module">
// Review page for «Fractals a la natura» (tools/fractals-review.mjs drives it): runs a form with presses at given times and draws stills.
import {frStart,frPress,frTick,frBlocked,FR_STIMS} from '../dist/fractals.js';
import {frDraw,frFixedScale} from '../dist/fractals-escena.js';
window.FR_IDS=FR_STIMS.map(x=>x.id);
window.frShots=(id,n,gap,shots,W=1920,H=1080,lap=0)=>{const cv=document.getElementById('c');cv.width=W;cv.height=H;cv.style.width=W+'px';cv.style.height=H+'px';const c=cv.getContext('2d');frFixedScale(1);
 const s={frFirst:id,lock:false,waitCue:false,sound:false,reduced:false},g={};frStart(g,s);g.fractals.lap=lap;g.fractals.seed=12345;
 const out=[],dt=1/30;let t=0,k=0,t0=performance.now();const presses=[...Array(n)].map((_,i)=>.2+i*gap);
 shots=[...shots].sort((a,b)=>a-b);
 while(shots.length){if(k<presses.length&&t>=presses[k]){frPress(g,s);k++;}frTick(g,s,dt);t+=dt;
  if(t>=shots[0]){frDraw(c,W,H,g,s);out.push({t:+t.toFixed(2),url:cv.toDataURL(window.FR_PNG?'image/png':'image/jpeg',.92),n:g.fractals.S?.st.n||0,phase:g.fractals.phase});shots.shift();}}
 return {out,ms:performance.now()-t0};};
window.ready=true;
</script>
