# Publica la carpeta dist/ (l'app jugable) a GitHub Pages a cada push a main.
name: Publica a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # 0.76: list of the files the installed app (PWA) keeps offline, with sizes and hashes, from this very dist/.
      - run: node tools/pwa-build.mjs dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # The site is ~580 MB (videos): GitHub's file sync can take longer than the default 10 minutes.
          timeout: 1800000
